<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Branch Demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%);
      box-sizing: border-box;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      font-family: Arial, sans-serif;
    }
    nav {
      background: #333;
      color: #fff;
      padding: 1em;
    }
    nav ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
    }
    nav ul li {
      margin-right: 2em;
    }
    nav ul li a {
      color: #fff;
      text-decoration: none;
    }
    main {
      padding: 2em;
      flex: 1;
      min-height: 60vh;
    }
    footer {
      background: #222;
      color: #ccc;
      text-align: center;
      padding: 1em 0;
      width: 100%;
    }
  </style>
</head>
<body>
  <nav>
    <ul>
      <li><a href="#">Home</a></li>
      <li><a href="#">Features</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#">Contact us</a></li>
    </ul>
  </nav>
  <main>
    <h1>Welcome to Branch Demo</h1>
    <p>This is the main content area. Add your page content here.</p>
  </main>
  <footer>
    &copy; 2024 Branch Demo. All rights reserved.
  </footer>
</body>
</html>
